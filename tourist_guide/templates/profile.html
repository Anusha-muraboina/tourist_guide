{% extends "base.html" %}

{% block content %}

<section class="bg-slate-50 min-h-screen py-10">


<div class="md:max-w-6xl mx-auto px-4 pt-36">

    <!-- Cover Banner -->

    {% comment %} <div class="relative h-64 rounded-3xl overflow-hidden">

        <img
            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
            class="w-full h-full object-cover"
        >

        <div class="absolute inset-0 bg-black/30"></div>

    </div> {% endcomment %}

    <!-- Main Profile Card -->

    <div class="bg-white rounded-3xl shadow-xl p-8 -mt-20 relative z-10">

        <!-- Top Section -->

        <div class="flex flex-col lg:flex-row lg:justify-between lg:items-center">

            <div class="flex flex-col md:flex-row items-center gap-6">

                <div class="relative">

                    <img
                        id="profileImage"
                        src=""
                        class="w-36 h-36 rounded-full object-cover border-4 border-white shadow-lg"
                    >

                </div>

                <div>

                    <h1
                        id="username"
                        class="text-3xl font-bold text-slate-900"
                    >
                        Loading...
                    </h1>

                    <p
                        id="email"
                        class="text-slate-500 mt-2"
                    >
                    </p>

                    <span
                        id="role"
                        class="inline-block mt-3 bg-cyan-100 text-cyan-700 px-4 py-2 rounded-full text-sm font-medium"
                    >
                    </span>

                </div>

            </div>

            <button
                id="updateProfileBtn"
                class="mt-6 lg:mt-0 bg-cyan-600 hover:bg-cyan-700 text-white px-8 py-3 rounded-xl font-medium shadow-md"
            >
                Save Changes
            </button>

        </div>

        <!-- Stats -->

        <div class="grid md:grid-cols-4 gap-5 mt-10">

            <div class="bg-cyan-50 rounded-2xl p-5">

                <p class="text-gray-500 text-sm">
                    Account Type
                </p>

                <h3
                    id="accountRole"
                    class="text-xl font-bold mt-2"
                >
                </h3>

            </div>

            <div class="bg-green-50 rounded-2xl p-5">

                <p class="text-gray-500 text-sm">
                    Country
                </p>

                <h3
                    id="countryText"
                    class="text-xl font-bold mt-2"
                >
                </h3>

            </div>

            <div class="bg-purple-50 rounded-2xl p-5">

                <p class="text-gray-500 text-sm">
                    State
                </p>

                <h3
                    id="stateText"
                    class="text-xl font-bold mt-2"
                >
                </h3>

            </div>

            <div class="bg-orange-50 rounded-2xl p-5">

                <p class="text-gray-500 text-sm">
                    Verification
                </p>

                <h3
                    id="verifyStatus"
                    class="text-xl font-bold mt-2"
                >
                </h3>

            </div>

        </div>

        <!-- Form -->

        <div class="mt-10">

            <h2 class="text-xl font-bold mb-6">
                Personal Information
            </h2>

            <div class="grid md:grid-cols-2 gap-6">

                <div>

                    <label class="block text-sm text-gray-500 mb-2">
                        Username
                    </label>

                    <input
                        id="editUsername"
                        type="text"
                        class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-cyan-500 outline-none"
                    >

                </div>

                <div>

                    <label class="block text-sm text-gray-500 mb-2">
                        Phone Number
                    </label>

                    <input
                        id="editPhone"
                        type="text"
                        class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-cyan-500 outline-none"
                    >

                </div>

                <div>

                    <label class="block text-sm text-gray-500 mb-2">
                        Location
                    </label>

                    <input
                        id="editLocation"
                        type="text"
                        class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-cyan-500 outline-none"
                    >

                </div>

                <div>

                    <label class="block text-sm text-gray-500 mb-2">
                        State
                    </label>

                    <input
                        id="editState"
                        type="text"
                        class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-cyan-500 outline-none"
                    >

                </div>

                <div>

                    <label class="block text-sm text-gray-500 mb-2">
                        Country
                    </label>

                    <input
                        id="editCountry"
                        type="text"
                        class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-cyan-500 outline-none"
                    >

                </div>

                <div>

                    <label class="block text-sm text-gray-500 mb-2">
                        Profile Image
                    </label>

                    <input
                        id="editProfileImage"
                        type="file"
                        class="w-full border border-gray-300 rounded-xl px-4 py-3"
                    >

                </div>

            </div>

        </div>

    </div>

</div>


</section>
<script>

async function loadProfile(){

    try{

        const response =
            await fetch(
                "/user/api/profile/"
            );

        const result =
            await response.json();

        console.log(result);

        const user =
            result.data;

        document.getElementById(
            "profileImage"
        ).src =
            user.profile_image ||
            "https://ui-avatars.com/api/?name=" +
            user.username;

        document.getElementById(
            "username"
        ).innerText =
            user.username;

        document.getElementById(
            "email"
        ).innerText =
            user.email;

        document.getElementById(
            "role"
        ).innerText =
            user.role;

        document.getElementById(
            "accountRole"
        ).innerText =
            user.role;

        document.getElementById(
            "countryText"
        ).innerText =
            user.country || "-";

        document.getElementById(
            "stateText"
        ).innerText =
            user.state || "-";

        document.getElementById(
            "verifyStatus"
        ).innerText =
            user.is_verified
                ? "Verified"
                : "Pending";

        document.getElementById(
            "editUsername"
        ).value =
            user.username || "";

        document.getElementById(
            "editPhone"
        ).value =
            user.phone_number || "";

        document.getElementById(
            "editLocation"
        ).value =
            user.location || "";

        document.getElementById(
            "editState"
        ).value =
            user.state || "";

        document.getElementById(
            "editCountry"
        ).value =
            user.country || "";

    }

    catch(error){

        console.log(error);

    }

}

loadProfile();

</script>

{% endblock %}
