<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tour Management Dashboard{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        
        <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between hidden md:flex">
            <div>
                <div class="h-16 flex items-center justify-center bg-slate-950 px-6">
                    <span class="text-xl font-bold text-white tracking-wide">
                        <i class="fa-solid fa-compass text-teal-400 mr-2"></i>TourAdmin
                    </span>
                </div>

                <nav class="mt-6 px-4 space-y-1">
                    <a href="{% url 'dashboard' %}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg {% if request.resolver_match.url_name == 'dashboard' %}bg-teal-600 text-white{% else %}hover:bg-slate-800 hover:text-white{% endif %} transition-colors">
                        <i class="fa-solid fa-chart-pie w-5 mr-3 text-lg"></i> Dashboard
                    </a>

                    <div class="pt-4 pb-2 px-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                        Core Management
                    </div>

                    <a href="{% url 'tour_category_list' %}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-800 hover:text-white transition-colors">
                        <i class="fa-solid fa-route w-5 mr-3 text-lg text-slate-400"></i> Category
                    </a>

                    <a href="{% url 'tour_highlight_list' %}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-800 hover:text-white transition-colors">
                        <i class="fa-solid fa-tags w-5 mr-3 text-lg text-slate-400"></i> Highlight
                    </a>

                    <a href="{% url 'tour_include_list' %}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-800 hover:text-white transition-colors">
                        <i class="fa-solid fa-calendar-days w-5 mr-3 text-lg text-slate-400"></i> Include
                    </a>

                    <a href="{% url 'tour_exclude_list' %}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-800 hover:text-white transition-colors">
                        <i class="fa-solid fa-tags w-5 mr-3 text-lg text-slate-400"></i> Exclude
                    </a>

  <a href="{% url 'amenity_list' %}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-800 hover:text-white transition-colors">
                        <i class="fa-solid fa-tags w-5 mr-3 text-lg text-slate-400"></i> Amenity
                    </a>
                    
  <a href="{% url 'tour_schedule_list' %}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-800 hover:text-white transition-colors">
                        <i class="fa-solid fa-tags w-5 mr-3 text-lg text-slate-400"></i> Sheduled
                    </a>


  <a href="{% url 'tour_pricing_list' %}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-800 hover:text-white transition-colors">
                        <i class="fa-solid fa-tags w-5 mr-3 text-lg text-slate-400"></i> Pricing
                    </a>

                  <a href="{% url 'tour_list' %}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-800 hover:text-white transition-colors">
                        <i class="fa-solid fa-tags w-5 mr-3 text-lg text-slate-400"></i> Tours
                    </a>


                  <a href="{% url 'contact_us_list' %}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-800 hover:text-white transition-colors">
                        <i class="fa-solid fa-tags w-5 mr-3 text-lg text-slate-400"></i> Contact 
                    </a>
                            <a href="{% url 'coupon_list' %}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-800 hover:text-white transition-colors">
                        <i class="fa-solid fa-tags w-5 mr-3 text-lg text-slate-400"></i> Coupon 
                    </a>

    

                 <a href="{% url 'rating_list' %}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg hover:bg-slate-800 hover:text-white transition-colors">
                        <i class="fa-solid fa-tags w-5 mr-3 text-lg text-slate-400"></i> Rating 
                    </a>


                </nav>

            </div>

            <div class="p-4 border-t border-slate-800 bg-slate-950 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-full bg-teal-500 flex items-center justify-center text-white font-bold">A</div>
                    <div>
                        <p class="text-sm font-medium text-white">Admin User</p>
                        <p class="text-xs text-slate-400">Manager</p>
                    </div>
                </div>
                <a href="#" class="text-slate-400 hover:text-red-400 transition-colors">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </a>
            </div>
        </aside>

        <div class="flex-1 flex flex-col overflow-hidden">
            
            <header class="h-16 bg-white shadow-sm flex items-center justify-between px-6 z-10">
                <div class="flex items-center">
                    <button class="text-gray-500 md:hidden focus:outline-none mr-4">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                    <h1 class="text-xl font-semibold text-gray-800">
                        {% block dynamic_header %}Overview Dashboard{% endblock %}
                    </h1>
                </div>
            </header>

            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6">
                {% block content %}
                {% endblock %}
            </main>
        </div>
    </div>

</body>
</html>
