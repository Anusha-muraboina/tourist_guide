{% extends "tourist_admin/base.html" %}

{% block title %}Payment Policy{% endblock %}

{% block dynamic_header %}
Payment Policy
{% endblock %}

{% block content %}

<div class="max-w-3xl mx-auto bg-white rounded-xl shadow p-8">

    <form method="post">
        {% csrf_token %}
        <div class="mb-6">
            <label class="block mb-2 font-semibold">
                Tour
            </label>
            {{ form.tour }}
        </div>

        <div class="space-y-5">

            <label class="flex items-center gap-3">

                {{ form.allow_pay_at_location }}

                <span>

                    Allow Pay at Location

                </span>

            </label>

            <label class="flex items-center gap-3">

                {{ form.allow_partial_payment }}

                <span>

                    Allow Partial Payment

                </span>

            </label>

            <label class="flex items-center gap-3">

                {{ form.allow_full_payment }}

                <span>

                    Allow Full Payment

                </span>

            </label>

        </div>

        <div class="mt-8">

            <button
                class="bg-teal-600 text-white px-6 py-3 rounded-lg">

                Save

            </button>

            <a href="{% url 'payment_policy_list' %}"
               class="ml-3 px-6 py-3 border rounded-lg">

                Cancel

            </a>

        </div>

    </form>

</div>

{% endblock %}
