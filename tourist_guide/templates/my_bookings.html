{% extends "base.html" %}

{% block content %}
<section class="bg-slate-50 min-h-screen py-10 antialiased">
    <div class="max-w-7xl mx-auto px-4 pt-16">

        <!-- Header -->
        <div class="mb-10  flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class=" text-xl md:text-3xl font-extrabold text-slate-900 tracking-tight">
                    My Bookings
                </h1>
                <p class="text-slate-500 mt-1.5 text-sm md:text-base font-medium">
                    View, track, and manage your tour reservations and guide assignments.
                </p>
            </div>
        </div>

        <!-- Layout Grid -->
        <div class="grid lg:grid-cols-3 gap-8 items-start">

            <!-- Booking List Sidebar -->
            <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden lg:sticky lg:top-6">
                <div class="p-5 border-b border-slate-100 bg-white flex items-center justify-between">
                    <h3 class="font-bold text-slate-800 tracking-tight">
                        Booking History
                    </h3>
                </div>

                <div
                    id="bookingContainer"
                    class="max-h-[750px] overflow-y-auto divide-y divide-slate-100 scrollbar-thin"
                >
                    <!-- JavaScript injected lists -->
                </div>
            </div>

            <!-- Booking Detail Content Display Container -->
            <div class="lg:col-span-2">
                <div
                    id="bookingDetail"
                    class="bg-white rounded-3xl shadow-sm border border-slate-100 p-6 md:p-8 min-h-[650px] transition-all duration-300 relative overflow-hidden"
                >
                    <!-- Empty State Placeholder -->
                    <div class="flex flex-col items-center justify-center py-32 text-center">
                        <div class="w-20 h-20 bg-slate-50 rounded-2xl flex items-center justify-center mb-6 text-slate-400">
                            <i class="fa-regular fa-calendar-days text-3xl"></i>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800 tracking-tight">
                            Select a Reservation
                        </h3>
                        <p class="text-slate-400 text-sm mt-1.5 max-w-xs mx-auto">
                            Click any trip or tour profile from the sidebar panel to check details.
                        </p>
                    </div>
                </div>
            </div>

        </div>
    </div>
</section>

<script>
const CURRENT_USER_ROLE = "{{ request.user.role|default:''|escapejs }}".toLowerCase();
const CURRENT_USER_ID = Number("{{ request.user.id|default:'0'|escapejs }}") || 0;
let GUIDE_BOOKINGS_CACHE = [];

async function loadBookings(){
    try{
        const bookingListURL =
            CURRENT_USER_ROLE === "guide"
                ? "/booking/api/guide/pending-bookings/"
                : "/booking/api/booking-list/";

        const response = await fetch(bookingListURL, {
            method: "GET",
            credentials: "same-origin"
        });
        const result = await response.json();
        const container = document.getElementById("bookingContainer");

        container.innerHTML = "";

        if (CURRENT_USER_ROLE === "guide") {
            const heading = document.querySelector("#bookingContainer")
                ?.parentElement
                ?.querySelector("h3");
            if (heading) heading.textContent = "Guide Requests";
        }

        const bookings = Array.isArray(result.data)
            ? result.data
            : Array.isArray(result.bookings)
                ? result.bookings
                : [];

        GUIDE_BOOKINGS_CACHE = bookings;

        bookings.forEach(booking => {
            // Refined Tailwind native color mappings for clean UI styling strings
let statusClasses = "";

            if (booking.status === "confirmed") {

                statusClasses =
                    "bg-emerald-50 text-emerald-700 border-emerald-100";

            } else if (booking.status === "on_process") {

                statusClasses =
                    "bg-blue-50 text-blue-700 border-blue-100";

            } else if (booking.status === "completed") {

                statusClasses =
                    "bg-indigo-50 text-indigo-700 border-indigo-100";

            } else if (booking.status === "cancelled") {

                statusClasses =
                    "bg-rose-50 text-rose-700 border-rose-100";

            } else {

                statusClasses =
                    "bg-amber-50 text-amber-700 border-amber-100";
            }

            container.innerHTML += `
                <div
                    onclick="loadBookingDetail(${booking.id})"
                    class="p-5 cursor-pointer hover:bg-slate-50/80 active:bg-slate-100/50 transition-all duration-200 border-l-4 border-l-transparent hover:border-l-cyan-500 group"
                >
                    <div class="flex justify-between items-start gap-4">
                        <div class="space-y-0.5">
                            <h4 class="font-bold text-slate-800 group-hover:text-cyan-600 transition-colors line-clamp-1">
                                ${booking.tour_name}
                            </h4>
                            <p class="text-xs font-mono tracking-wider text-slate-400 uppercase">
                                ${booking.booking_id}
                            </p>
                        </div>
                        <span class="text-xs px-2.5 py-1 rounded-full font-semibold tracking-wide border uppercase ${statusClasses} shrink-0">
                            ${booking.status}
                        </span>
                    </div>

                    <div class="mt-4 flex items-center justify-between text-xs font-medium text-slate-500">
                        <div class="flex items-center gap-1.5 text-slate-900 font-semibold text-sm">
                            <span class="text-xs font-normal text-slate-400">Total:</span>
                            ₹${Number(booking.total_amount).toLocaleString('en-IN')}
                        </div>
                        <div class="flex items-center gap-1 text-slate-400">
                            <i class="fa-regular fa-clock text-[10px]"></i>
                            <span>${booking.tour_date}</span>
                        </div>
                    </div>
                </div>
            `;
        });

        if (bookings.length) {
            loadBookingDetail(bookings[0].id);
        } else if (CURRENT_USER_ROLE === "guide") {
            document.getElementById("bookingDetail").innerHTML = `
                <div class="flex flex-col items-center justify-center py-32 text-center">
                    <div class="w-20 h-20 bg-amber-50 rounded-2xl flex items-center justify-center mb-6 text-amber-500">
                        <i class="fa-regular fa-calendar-xmark text-3xl"></i>
                    </div>
                    <h3 class="text-lg font-bold text-slate-800">No Pending Guide Requests</h3>
                    <p class="text-slate-400 text-sm mt-2 max-w-md">
                        There are currently no pending bookings assigned to you.
                    </p>
                </div>
            `;
        }

    }catch(error){
        console.error("Error loading booking index stream:", error);
    }
}

async function cancelBooking(id){
    if(!confirm("Are you sure you want to cancel this booking?")){
        return;
    }

    try {
        const response = await fetch(`/booking/api/cancel/${id}/`, {
            method: "POST",
            headers: {
                "X-CSRFToken": getCookie("csrftoken")
            }
        });
        const result = await response.json();
        if(result.success){
            alert("Booking cancelled successfully");
            loadBookings();
        }
    } catch(err) {
        console.error("Cancellation network processing failed:", err);
    }
}





async function verifyBooking(bookingId) {

    const input = document.getElementById(
        `verificationCode-${bookingId}`
    );

    const code = input.value.trim();

    if (!code) {
        alert("Please enter the verification code.");
        input.focus();
        return;
    }

    if (!/^\d{6}$/.test(code)) {
        alert("Please enter a valid 6-digit verification code.");
        input.focus();
        return;
    }

    try {

        const response = await fetch(
            `/booking/api/guide/verify/${bookingId}/`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie("csrftoken")
                },

                body: JSON.stringify({
                    code: code
                })
            }
        );

        const result = await response.json();

        if (response.ok && result.success) {

            alert("Booking verified successfully.");

            // Reload list + detail
            await loadBookings();

            // Reload selected booking
            await loadBookingDetail(bookingId);

        } else {

            alert(
                result.message ||
                "Invalid verification code."
            );
        }

    } catch (error) {

        console.error(
            "Verification error:",
            error
        );

        alert(
            "Unable to verify booking. Please try again."
        );
    }
}


async function completeBooking(bookingId) {

    const confirmed = confirm(
        "Are you sure you want to mark this tour as completed?"
    );

    if (!confirmed) {
        return;
    }

    try {

        const response = await fetch(
            `/booking/api/guide/complete/${bookingId}/`,
            {
                method: "POST",

                headers: {
                    "X-CSRFToken": getCookie("csrftoken")
                }
            }
        );

        const result = await response.json();

        if (response.ok && result.success) {

            alert(
                "Tour completed successfully."
            );

            // Refresh booking list
            await loadBookings();

            // Refresh booking details
            await loadBookingDetail(bookingId);

        } else {

            alert(
                result.message ||
                "Unable to complete booking."
            );
        }

    } catch (error) {

        console.error(
            "Completion error:",
            error
        );

        alert(
            "Unable to complete booking. Please try again."
        );
    }
}

function getCookie(name){
    let cookieValue = null;
    if(document.cookie){
        const cookies = document.cookie.split(";");
        for(let cookie of cookies){
            cookie = cookie.trim();
            if(cookie.startsWith(name + "=")){
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

async function acceptBooking(bookingId) {

    const confirmed = confirm(
        "Are you sure you want to accept this tour booking?"
    );

    if (!confirmed) {
        return;
    }


    const acceptBtn = document.getElementById(`acceptBtn-${bookingId}`);
    const declineBtn = document.getElementById(`declineBtn-${bookingId}`);


    if (acceptBtn) {
        acceptBtn.disabled = true;

        acceptBtn.innerHTML = `
            <i class="fa-solid fa-spinner fa-spin"></i>
            Accepting...
        `;
    }

    if (declineBtn) {
        declineBtn.disabled = true;
    }


    try {

        const response = await fetch(
            `/booking/api/guide/accept/${bookingId}/`,
            {
                method: "POST",

                headers: {
                    "X-CSRFToken": getCookie("csrftoken"),
                    "Content-Type": "application/json"
                }
            }
        );


        const result = await response.json();


        if (response.ok && result.success) {

            alert(
                result.message ||
                "Booking accepted successfully."
            );


            // Refresh booking list
            await loadBookings();


            // Refresh current booking details
            await loadBookingDetail(bookingId);


        } else {

            alert(
                result.message ||
                "Unable to accept this booking."
            );


            if (acceptBtn) {

                acceptBtn.disabled = false;

                acceptBtn.innerHTML = `
                    <i class="fa-solid fa-circle-check"></i>
                    Accept Booking
                `;
            }

            if (declineBtn) {
                declineBtn.disabled = false;
            }

        }


    } catch (error) {

        console.error(
            "Accept booking error:",
            error
        );


        alert(
            "Unable to accept booking. Please try again."
        );


        if (acceptBtn) {

            acceptBtn.disabled = false;

            acceptBtn.innerHTML = `
                <i class="fa-solid fa-circle-check"></i>
                Accept Booking
            `;
        }

        if (declineBtn) {
            declineBtn.disabled = false;
        }

    }

}

async function declineBooking(bookingId) {

    const confirmed = confirm(
        "Are you sure you want to decline this tour booking?\n\nThe booking will be offered to the next available guide."
    );

    if (!confirmed) {
        return;
    }


    const acceptBtn = document.getElementById(`acceptBtn-${bookingId}`);
    const declineBtn = document.getElementById(`declineBtn-${bookingId}`);


    if (declineBtn) {

        declineBtn.disabled = true;

        declineBtn.innerHTML = `
            <i class="fa-solid fa-spinner fa-spin"></i>
            Declining...
        `;
    }


    if (acceptBtn) {
        acceptBtn.disabled = true;
    }


    try {

        const response = await fetch(
            `/booking/api/guide/decline/${bookingId}/`,
            {
                method: "POST",

                headers: {
                    "X-CSRFToken": getCookie("csrftoken"),
                    "Content-Type": "application/json"
                }
            }
        );


        const result = await response.json();


        if (response.ok && result.success) {

            alert(
                result.message ||
                "Booking declined successfully."
            );


            /*
             * Important:
             *
             * Backend will assign the booking
             * to the next guide.
             *
             * Therefore reload the booking list
             * and details.
             */

            await loadBookings();


            /*
             * If backend assigned another guide,
             * the current guide will no longer see
             * the Accept / Decline buttons.
             */

            if (result.next_guide) {

                console.log(
                    "Booking assigned to next guide:",
                    result.next_guide
                );

            }

        } else {

            alert(
                result.message ||
                "Unable to decline this booking."
            );


            if (declineBtn) {

                declineBtn.disabled = false;

                declineBtn.innerHTML = `
                    <i class="fa-solid fa-circle-xmark"></i>
                    Decline Booking
                `;
            }


            if (acceptBtn) {
                acceptBtn.disabled = false;
            }

        }


    } catch (error) {

        console.error(
            "Decline booking error:",
            error
        );


        alert(
            "Unable to decline booking. Please try again."
        );


        if (declineBtn) {

            declineBtn.disabled = false;

            declineBtn.innerHTML = `
                <i class="fa-solid fa-circle-xmark"></i>
                Decline Booking
            `;
        }


        if (acceptBtn) {
            acceptBtn.disabled = false;
        }

    }

}
