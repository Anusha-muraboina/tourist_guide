</section>

<script>

async function loadBookings(){

    try{

        const response =
            await fetch(
                "/booking/api/booking-list/"
            );

        const result =
            await response.json();

        const container =
            document.getElementById(
                "bookingContainer"
            );

        container.innerHTML = "";

        result.data.forEach(
            booking => {

                let statusColor =
                    booking.status === "confirmed"
                    ? "green"
                    : booking.status === "cancelled"
                    ? "red"
                    : "yellow";

                container.innerHTML += `

                <div
                    onclick="loadBookingDetail(${booking.id})"
                    class="
                        p-5
                        border-b
                        cursor-pointer
                        hover:bg-cyan-50
                        transition
                    "
                >

                    <div class="flex justify-between">

                        <div>

                            <h3 class="font-semibold">

                                ${booking.tour_name}

                            </h3>

                            <p class="text-sm text-gray-500 mt-1">

                                ${booking.booking_id}

                            </p>

                        </div>

                        <span
                            class="
                                text-xs
                                px-3 py-1
                                rounded-full
                                bg-${statusColor}-100
                                text-${statusColor}-700
                                h-fit
                            "
                        >

                            ${booking.status}

                        </span>

                    </div>

                    <div class="mt-3 text-sm text-gray-600">

                        <p>

                            ₹${booking.total_amount}

                        </p>

                        <p>

                            ${booking.tour_date}

                        </p>

                    </div>

                </div>

                `;

            }
        );

        if(result.data.length){

            loadBookingDetail(
                result.data[0].id
            );

        }

    }catch(error){

        console.log(error);

    }

}

async function loadBookingDetail(id){

    try{

        const response =
            await fetch(
                `/booking/api/booking-detail/${id}/`
            );

        const result =
            await response.json();

        const booking =
            result.data;

        document.getElementById(
            "bookingDetail"
        ).innerHTML = `

            <div class="flex justify-between items-start">

                <div>

                    <h2 class="text-3xl font-bold">

                        ${booking.tour_details.title}

                    </h2>

                    <p class="text-gray-500 mt-2">

                        Booking ID:
                        ${booking.booking_id}

                    </p>

                </div>

                <span
                    class="
                        px-4 py-2
                        rounded-full
                        bg-green-100
                        text-green-700
                    "
                >

                    ${booking.status}

                </span>

            </div>

            <div class="grid md:grid-cols-2 gap-8 mt-10">

                <div>

                    <h3 class="font-semibold text-lg mb-4">
                        Guest Information
                    </h3>

                    <div class="space-y-2">

                        <p>
                            <strong>Name:</strong>
                            ${booking.guest_name}
                        </p>

                        <p>
                            <strong>Email:</strong>
                            ${booking.guest_email}
                        </p>

                        <p>
                            <strong>Phone:</strong>
                            ${booking.guest_phone}
                        </p>

                    </div>

                </div>

                <div>

                    <h3 class="font-semibold text-lg mb-4">
                        Tour Information
                    </h3>

                    <div class="space-y-2">

                        <p>
                            <strong>Date:</strong>

                        </p>

                            ${booking.tour_time}
                        </p>

                        <p>

                            ${

                                ?
                                booking.selected_guide.username
                                :
                                "Not Assigned"

                    </div>

                </div>

            </div>






            <!-- Guide Information -->

<div class="mt-10">

    <h3 class="font-semibold text-lg mb-4">
        Guide Information
    </h3>

    ${
        booking.selected_guide
        ?
        `

                >

                    <h4 class="text-lg font-bold">

                        ${booking.selected_guide.username}

                    </h4>

                    <p class="text-gray-500 mt-1">

                        ${booking.selected_guide.email}

                    </p>

                    <p class="text-gray-600 mt-1">

                    </p>

                    <p class="text-gray-600 mt-1">

                        ${booking.selected_guide.state}

</div>





            <div class="mt-10">

                </h3>

                    </div>

                        </span>

                    </div>

                    <div class="flex justify-between">

                        <span>Total Amount</span>

                        </span>

                    </div>

                    <div class="flex justify-between">

                        <span>

                        </span>

                    </span>
                    `

    }catch(error){

    }

}

async function cancelBooking(id){

    if(
        !confirm(
            "Are you sure you want to cancel this booking?"
        )
    ){
        return;
    }

    const response =
        await fetch(
            `/booking/api/cancel/${id}/`,
            {
                method:"POST",
                headers:{
                    "X-CSRFToken":
                        getCookie(
                            "csrftoken"
                        )
                }
            }
        );

    const result =
        await response.json();

    if(result.success){

        alert(
            "Booking cancelled successfully"
        );

        loadBookings();

    }

}

function getCookie(name){

    let cookieValue = null;

    if(document.cookie){

        const cookies =
            document.cookie.split(";");

        for(let cookie of cookies){

            cookie =
                cookie.trim();

            if(
                cookie.startsWith(
                    name + "="
                )
            ){

                cookieValue =
                    decodeURIComponent(
                        cookie.substring(
                            name.length + 1
                        )
                    );

                break;

            }

        }

    }

    return cookieValue;

}

loadBookings();

</script>
