{% extends 'base.html' %}

{% block title %}
Confirm Password
{% endblock %}

{% block content %}

<section class="min-h-screen bg-gray-100 flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-white rounded-[30px] shadow-2xl p-8">


        <!-- HEADER -->

        <div class="text-center mb-8">

            <h2 class="text-4xl font-black text-blue-900">

                Reset Password

            </h2>

            <p class="text-gray-500 mt-2">

                Create your new password

            </p>

        </div>



        <!-- FORM -->

        <form method="POST" class="space-y-5">

            {% csrf_token %}


            <!-- PASSWORD -->

            <div class="relative">

                <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="New Password"
                    class="w-full h-12 px-4 pr-12 rounded-xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-400">

                <button
                    type="button"
                    onclick="togglePassword('password', 'passwordIcon')"
                    class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500">

                    <i id="passwordIcon" class="fa-solid fa-eye"></i>

                </button>

            </div>



            <!-- CONFIRM PASSWORD -->

            <div class="relative">

                <input
                    type="password"
                    name="confirm_password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    class="w-full h-12 px-4 pr-12 rounded-xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-400">

                <button
                    type="button"
                    onclick="togglePassword('confirmPassword', 'confirmPasswordIcon')"
                    class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500">

                    <i id="confirmPasswordIcon" class="fa-solid fa-eye"></i>

                </button>

            </div>



            <!-- BUTTON -->

            <button
                class="w-full h-12 rounded-xl bg-blue-900 hover:bg-blue-700 text-white font-bold transition duration-300">

                Update Password

            </button>

        </form>

    </div>

</section>



<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>


<script>

    function togglePassword(inputId, iconId) {

        const input = document.getElementById(inputId);

        const icon = document.getElementById(iconId);

        if (input.type === "password") {

            input.type = "text";

            icon.classList.remove("fa-eye");

            icon.classList.add("fa-eye-slash");

        }

        else {

            input.type = "password";

            icon.classList.remove("fa-eye-slash");

            icon.classList.add("fa-eye");

        }

    }

</script>

{% endblock %}
