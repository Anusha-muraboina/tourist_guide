{% extends 'base.html' %}
{% load static %}

{% block content %}

<!-- Modern Sleek Hero Section -->
<section class="relative overflow-hidden bg-gradient-to-br from-slate-900 via-indigo-950 to-blue-950 pt-32 pb-24 text-white">
    <!-- Decorative Ambient Glow Effects -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-blue-500/15 rounded-full blur-3xl pointer-events-none"></div>

    <div class="container mx-auto px-6 relative z-10 text-center max-w-4xl">
        <span class="inline-block px-4 py-1.5 rounded-full bg-white/10 border border-white/10 text-indigo-300 font-semibold text-xs uppercase tracking-widest mb-4 backdrop-blur-md">
            Our Insights & Articles
        </span>
        <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-white">
            Our Blogs
        </h1>
        <p class="text-blue-100 mt-4 text-xl max-w-2xl mx-auto">
            Stay updated with the latest insights, tips, and stories.
        </p>
    </div>
</section>


<!-- Blog Section -->
<section class="py-16 md:py-24 bg-slate-50/60 min-h-[600px]">

    <div class="container mx-auto px-4 sm:px-6 lg:px-8 max-w-7xl">


        <!-- Search -->
        <div class="max-w-2xl mx-auto mb-14 -mt-12 md:-mt-14 relative z-20">

            <div class="relative bg-white p-2 rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-200/80 backdrop-blur-xl flex items-center">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search blogs by title or keyword..."
                    autocomplete="off"
                    class="w-full px-5 py-3.5 pl-12
                           border-0
                           rounded-2xl
                           bg-transparent
                           focus:ring-0
                           outline-none
                           text-slate-800
                           placeholder-slate-400
                           text-base md:text-lg">

                <!-- Search Icon -->
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="w-6 h-6 text-gray-400 absolute left-5 top-1/2 -translate-y-1/2 pointer-events-none"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor">

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>

                </svg>

            </div>

        </div>


        <!-- Blog Cards -->
        <div
            id="blogContainer"
            class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

        </div>


        <!-- Loading State -->
        <div
            id="loading"
            class="text-center py-20 text-gray-500 text-lg">

            <div
                class="animate-spin
                       w-8 h-8
                       border-4
                       border-blue-500
                       border-t-transparent
                       rounded-full
                       mx-auto
                       mb-4">
            </div>

            Loading blogs...

        </div>


        <!-- No Results -->
        <div
            id="noResults"
            class="hidden col-span-full text-center py-20 bg-white rounded-3xl border border-slate-200/60 shadow-sm max-w-lg mx-auto p-8">

            <div class="text-gray-300 mb-4">

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="w-16 h-16 mx-auto"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor">

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="1.5"
                        d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>

                </svg>

            </div>

            <h2 class="text-2xl font-semibold text-gray-700">
                No blogs found
            </h2>

            <p class="text-gray-500 mt-2">
                Try adjusting your search term.
            </p>

        </div>


        <!-- Error State -->
        <div
            id="errorMessage"
            class="hidden text-center py-20 bg-white rounded-3xl border border-slate-200/60 shadow-sm max-w-lg mx-auto p-8">

            <div class="text-red-400 mb-4">

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="w-14 h-14 mx-auto"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor">

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="1.5"
                        d="M12 9v3.75m9 0a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>

                </svg>

            </div>

            <h2 class="text-xl font-semibold text-gray-700">
                Unable to load blogs
            </h2>

            <p class="text-gray-500 mt-2">
                Please try again later.
            </p>

            <button
                onclick="loadBlogs()"
                class="mt-6
                       px-6 py-3
                       bg-blue-600
                       hover:bg-blue-700
                       text-white
                       rounded-xl
                       font-semibold
                       transition shadow-md shadow-blue-600/20 active:scale-95 cursor-pointer">

                Try Again

            </button>

        </div>


    </div>

</section>


<script>

    /*
    |--------------------------------------------------------------------------
    | API
    |--------------------------------------------------------------------------
    */

    const API_URL = "/blog/api/blogs/";

    let allBlogs = [];


    /*
    |--------------------------------------------------------------------------
    | DOM READY
    |--------------------------------------------------------------------------
    */

    document.addEventListener("DOMContentLoaded", function () {

        loadBlogs();

        const searchInput =
            document.getElementById("searchInput");

        if (searchInput) {

            searchInput.addEventListener(
                "input",
                searchBlogs
            );

        }

    });


    /*
    |--------------------------------------------------------------------------
    | LOAD BLOGS
    |--------------------------------------------------------------------------
    */

    async function loadBlogs() {

        const loading =
            document.getElementById("loading");

        const errorMessage =
            document.getElementById("errorMessage");

        const noResults =
            document.getElementById("noResults");


        loading.classList.remove("hidden");

        errorMessage.classList.add("hidden");

        noResults.classList.add("hidden");


        try {

            const response =
                await fetch(API_URL);


            if (!response.ok) {

                throw new Error(
                    `HTTP error: ${response.status}`
                );

            }


            const data =
                await response.json();


            console.log(
                "Blog API Response:",
                data
            );


            loading.classList.add("hidden");


            if (
                data.success &&
                Array.isArray(data.results)
            ) {

                allBlogs = data.results;

                displayBlogs(allBlogs);

            } else {

                allBlogs = [];

                showNoResults();

            }


        } catch (error) {

            console.error(
                "Blog API Error:",
                error
            );


            loading.classList.add("hidden");

            errorMessage.classList.remove("hidden");

        }

    }


    /*
    |--------------------------------------------------------------------------
    | DISPLAY BLOGS
    |--------------------------------------------------------------------------
    */

    function displayBlogs(blogs) {

        const container =
            document.getElementById(
                "blogContainer"
            );

        const noResults =
            document.getElementById(
                "noResults"
            );


        container.innerHTML = "";


        if (
            !blogs ||
            blogs.length === 0
        ) {

            showNoResults();

            return;

        }


        noResults.classList.add("hidden");


        blogs.forEach(function (blog) {


            const image =
                blog.image ||
                "{% static 'images/default-blog.jpg' %}";


            const category =
                blog.category &&
                blog.category.name
                    ? blog.category.name
                    : "General";


            const title =
                blog.title ||
                "Untitled Blog";


            const description =
                blog.short_description ||
                "Read this blog to learn more.";


            const date =
                formatDate(
                    blog.created_at
                );


            const readingTime =
                blog.reading_time
                    ? blog.reading_time
                    : "";


            const cardHTML = `

                <article
                    class="bg-white
                           rounded-3xl
                           border
                           border-slate-200/80
                           shadow-sm
                           hover:shadow-2xl
                           hover:-translate-y-1.5
                           transition-all
                           duration-300
                           overflow-hidden
                           group
                           flex
                           flex-col">


                    <!-- Image -->

                    <div
                        class="overflow-hidden
                               h-56
                               bg-gray-100
                               relative">

                        <img
                            src="${image}"
                            alt="${escapeHTML(title)}"
                            loading="lazy"
                            class="w-full
                                   h-full
                                   object-cover
                                   group-hover:scale-105
                                   transition-transform
                                   duration-500"
                            onerror="this.src='{% static 'images/default-blog.jpg' %}'">

                        <!-- Floating Category Badge -->
                        <div class="absolute top-4 left-4">
                            <span
                                class="bg-white/90
                                       backdrop-blur-md
                                       text-blue-700
                                       text-xs
                                       font-bold
                                       px-3.5
                                       py-1.5
                                       rounded-full
                                       shadow-sm">

                                ${escapeHTML(category)}

                            </span>
                        </div>

                    </div>


                    <!-- Content -->

                    <div
                        class="p-6
                               flex
                               flex-col
                               flex-1">


                        <!-- Date -->

                        <div
                            class="flex
                                   justify-between
                                   items-center
                                   mb-3">

                            <span
                                class="text-xs
                                       text-gray-400
                                       font-medium">

                                ${date}

                            </span>

                        </div>


                        <!-- Title -->

                        <h2
                            class="text-xl
                                   font-semibold
                                   text-gray-800
                                   mb-3
                                   line-clamp-2
                                   group-hover:text-blue-600
                                   transition-colors">

                            ${escapeHTML(title)}

                        </h2>


                        <!-- Description -->

                        <p
                            class="text-gray-600
                                   text-sm
                                   mb-6
                                   line-clamp-3">

                            ${escapeHTML(description)}

                        </p>


                        <!-- Bottom -->

                        <div
                            class="mt-auto
                                   pt-4
                                   border-t
                                   border-slate-100
                                   flex
                                   items-center
                                   justify-between">


                            ${
                                readingTime
                                    ? `
                                        <span
                                            class="text-xs
                                                   text-gray-400">

                                        ${escapeHTML(
                                            String(readingTime)
                                        )}

                                        </span>
                                      `
                                    : "<span></span>"
                            }


                            <a
                                href="/blog/${encodeURIComponent(blog.slug)}/"
                                class="inline-flex
                                       items-center
                                       text-blue-600
                                       hover:text-blue-700
                                       font-semibold
                                       text-sm
                                       group-hover:translate-x-1
                                       transition-all">

                                Read More

                                <span
                                    class="ml-2
                                           text-xl
                                           leading-none">

                                    →

                                </span>

                            </a>


                        </div>


                    </div>

                </article>

            `;


            container.insertAdjacentHTML(
                "beforeend",
                cardHTML
            );

        });

    }


    /*
    |--------------------------------------------------------------------------
    | SEARCH
    |--------------------------------------------------------------------------
    */

    function searchBlogs() {

        const input =
            document.getElementById(
                "searchInput"
            );


        if (!input) {

            return;

        }


        const value =
            input.value
                .toLowerCase()
                .trim();


        if (!value) {

            displayBlogs(allBlogs);

            return;

        }


        const filtered =
            allBlogs.filter(function (blog) {

                const title =
                    (
                        blog.title || ""
                    ).toLowerCase();


                const description =
                    (
                        blog.short_description || ""
                    ).toLowerCase();


                const category =
                    blog.category &&
                    blog.category.name
                        ? blog.category.name.toLowerCase()
                        : "";


                return (
                    title.includes(value) ||
                    description.includes(value) ||
                    category.includes(value)
                );

            });


        displayBlogs(filtered);

    }


    /*
    |--------------------------------------------------------------------------
    | DATE FORMAT
    |--------------------------------------------------------------------------
    */

    function formatDate(dateStr) {

        if (!dateStr) {

            return "";

        }


        const date =
            new Date(dateStr);


        if (isNaN(date.getTime())) {

            return "";

        }


        return date.toLocaleDateString(
            "en-US",
            {
                day: "numeric",
                month: "short",
                year: "numeric"
            }
        );

    }


    /*
    |--------------------------------------------------------------------------
    | NO RESULTS
    |--------------------------------------------------------------------------
    */

    function showNoResults() {

        const container =
            document.getElementById(
                "blogContainer"
            );

        const loading =
            document.getElementById(
                "loading"
            );

        const noResults =
            document.getElementById(
                "noResults"
            );


        loading.classList.add("hidden");

        container.innerHTML = "";

        noResults.classList.remove("hidden");

    }


    /*
    |--------------------------------------------------------------------------
    | ESCAPE HTML
    |--------------------------------------------------------------------------
    */

    function escapeHTML(value) {

        const div =
            document.createElement("div");

        div.textContent =
            value == null
                ? ""
                : String(value);

        return div.innerHTML;

    }

</script>

{% endblock %}
