{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="bg-white min-h-screen text-slate-800 font-sans antialiased selection:bg-indigo-500/10 selection:text-indigo-600 py-12">
    <div class="w-full max-w-3xl mx-auto px-4 sm:px-6">

        <div class="mb-8">
            <a href="{% url 'blog_list' %}" 
               class="inline-flex items-center gap-2 text-slate-500 hover:text-slate-900 transition-colors duration-200 group text-sm font-medium">
                <svg class="w-4 h-4 group-hover:-translate-x-1 transition-transform duration-200" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                <span>Back to Insights</span>
            </a>
        </div>

        <header class="mb-6">
            <h1 id="blogTitle" class="text-3xl sm:text-4xl md:text-5xl font-black text-slate-900 tracking-tight leading-[1.15]">
                Loading...
            </h1>
        </header>

        <div class="relative rounded-xl overflow-hidden bg-slate-100 border border-slate-200/60 mb-6 aspect-[16/9]">
            <img id="blogImage" class="w-full h-full object-cover" alt="Blog feature image">
        </div>

        <div class="flex items-center gap-4 text-xs sm:text-sm font-medium text-slate-500 mb-10 border-b border-slate-100 pb-4">
            <span id="blogCategory" class="text-indigo-600 font-semibold uppercase tracking-wider"></span>
            <span class="text-slate-300">•</span>
            <div class="flex items-center gap-1.5">
                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                <span id="blogDate"></span>
            </div>
        </div>

        <article id="blogDescription" class="prose prose-indigo md:prose-lg max-w-none text-slate-700 leading-relaxed prose-headings:text-slate-900 prose-headings:font-black prose-headings:tracking-tight prose-a:text-indigo-600 hover:prose-a:text-indigo-500 prose-blockquote:border-l-4 prose-blockquote:border-indigo-500 prose-blockquote:bg-slate-50 prose-blockquote:py-1 prose-blockquote:rounded-r-lg">
            </article>

        <hr class="my-12 border-slate-100" />

        <div class="flex items-center gap-4 text-slate-500 text-sm">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-white text-xs font-bold shadow-sm flex-shrink-0">
                TG
            </div>
            <div>
                <p class="text-slate-900 font-semibold text-xs uppercase tracking-wider">Travel Guide Insights</p>
                <p class="text-slate-400 text-xs mt-0.5">Verified expert recommendations & local itineraries.</p>
            </div>
        </div>

    </div>
</div>

<script>
    const path = window.location.pathname;
    const slug = path.split('/').filter(Boolean).pop();
    
    const API_URL = `http://127.0.0.1:9000/blog/blogs/${slug}/`;
    
    console.log("Fetching from:", API_URL);

    document.addEventListener("DOMContentLoaded", loadBlog);

    async function loadBlog() {
        const titleEl = document.getElementById("blogTitle");

        try {
            const response = await fetch(API_URL);
            
            if (!response.ok) throw new Error("Failed to fetch");

            const result = await response.json();
            console.log("✅ API Response:", result);

            // FIXED: Access data inside .data
            const blog = result.data;

            if (!blog) {
                throw new Error("No blog data found");
            }

            // Now fill the content
            titleEl.textContent = blog.title || "Untitled";
            document.getElementById("blogCategory").textContent = blog.category?.name || "General";
            document.getElementById("blogDate").textContent = formatDate(blog.created_at);
            document.getElementById("blogImage").src = blog.image || "";
            document.getElementById("blogDescription").innerHTML = blog.description || "<p>No content available.</p>";

            console.log("✅ Page updated successfully!");

        } catch (error) {
            console.error("Error:", error);
            titleEl.textContent = "Blog Not Found";
            document.getElementById("blogDescription").innerHTML = `
                <p class="text-red-600 text-center py-12">
                    Failed to load blog content.
                </p>
            `;
        }
    }

    function formatDate(dateStr) {
        return dateStr ? new Date(dateStr).toLocaleDateString("en-US", {
            day: "numeric",
            month: "long",
            year: "numeric"
        }) : "No date";
    }
</script>
{% endblock %}
