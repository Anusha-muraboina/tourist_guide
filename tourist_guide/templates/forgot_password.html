{% extends 'base.html' %}

{% block title %}
Forgot Password
{% endblock %}

{% block content %}

<section class="min-h-screen bg-gradient-to-br from-blue-50 to-white pt-24 flex items-center justify-center px-4 py-10">

    <div class="w-full max-w-md bg-white rounded-[35px] shadow-2xl p-8">


        <!-- HEADER -->

        <div class="text-center mb-8">

            <div class="w-20 h-20 mx-auto rounded-full bg-blue-100 flex items-center justify-center mb-5">

                <i class="fa-solid fa-lock text-3xl text-blue-500"></i>

            </div>

            <h2 class="text-4xl font-black text-gray-900">

                Forgot Password

            </h2>

            <p class="text-gray-500 mt-2">

                Verify email and reset password

            </p>

        </div>



        <!-- SUCCESS MESSAGE -->

        <div
            id="successMessage"
            class="hidden mb-4 px-4 py-3 rounded-xl bg-green-100 text-green-700 text-sm font-medium">

        </div>



        <!-- ERROR MESSAGE -->

        <div
            id="errorMessage"
            class="hidden mb-4 px-4 py-3 rounded-xl bg-red-100 text-red-700 text-sm font-medium">

        </div>



        <!-- FORM -->

        <form id="forgotPasswordForm" class="space-y-5">


            <!-- EMAIL -->

            <div>

                <label class="block text-sm font-bold text-gray-700 mb-2">

                    Email Address

                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter Email Address"
                    class="w-full h-12 px-4 rounded-xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-400">

            </div>



            <!-- VERIFY BUTTON -->

            <button
                type="button"
                id="verifyBtn"
                onclick="verifyEmail()"
                class="w-full h-12 rounded-xl bg-blue-500 hover:bg-blue-600 text-white font-bold transition duration-300">

                Verify Email

            </button>



            <!-- PASSWORD SECTION -->

            <div
                id="passwordSection"
                class="hidden space-y-5">


                <!-- PASSWORD -->

                <div>

                    <label class="block text-sm font-bold text-gray-700 mb-2">

                        New Password

                    </label>

                    <div class="relative">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter New Password"
                            class="w-full h-12 px-4 pr-12 rounded-xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-400">

                        <button
                            type="button"
                            onclick="togglePassword('password', 'passwordIcon')"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500">

                            <i id="passwordIcon" class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>



                <!-- CONFIRM PASSWORD -->

                <div>

                    <label class="block text-sm font-bold text-gray-700 mb-2">

                        Confirm Password

                    </label>

                    <div class="relative">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm Password"
                            class="w-full h-12 px-4 pr-12 rounded-xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-400">

                        <button
                            type="button"
                            onclick="togglePassword('confirmPassword', 'confirmPasswordIcon')"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500">

                            <i id="confirmPasswordIcon" class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>



                <!-- UPDATE BUTTON -->

                <button
                    type="button"
                    onclick="resetPassword()"
                    class="w-full h-12 rounded-xl bg-blue-900 hover:bg-blue-700 text-white font-bold transition duration-300">

                    Update Password

                </button>

            </div>

        </form>



        <!-- LOGIN -->

        <p class="text-center text-sm text-gray-500 mt-6">

            Remember password?

            <a href="/user/api/login/"
               class="text-blue-500 font-bold">

                Login

            </a>

        </p>

    </div>

</section>



<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>



<script>

function getCookie(name) {

    let cookieValue = null;

    if (document.cookie && document.cookie !== '') {

        const cookies = document.cookie.split(';');

        for (let i = 0; i < cookies.length; i++) {

            const cookie = cookies[i].trim();

            if (cookie.substring(0, name.length + 1) === (name + '=')) {

                cookieValue = decodeURIComponent(
                    cookie.substring(name.length + 1)
                );

                break;

            }

        }

    }

    return cookieValue;

}

const csrftoken = getCookie('csrftoken');
    // =========================================
    // VERIFY EMAIL
    // =========================================

    async function verifyEmail() {

        let email = document.getElementById(
            'email'
        ).value;

        let successMessage = document.getElementById(
            'successMessage'
        );

        let errorMessage = document.getElementById(
            'errorMessage'
        );



        successMessage.classList.add(
            'hidden'
        );

        errorMessage.classList.add(
            'hidden'
        );



        if (email === '') {

            errorMessage.innerHTML =
                'Please enter email';

            errorMessage.classList.remove(
                'hidden'
            );

            return;

        }



        try {

            let response = await fetch(
                '/user/api/forgot-password/',
                {

                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrftoken,
                    },

                    body: JSON.stringify({

                        step: 'verify_email',
                        email: email

                    })

                }
            );



            let data = await response.json();



            if (response.ok) {

                successMessage.innerHTML =
                    data.message;

                successMessage.classList.remove(
                    'hidden'
                );



                document.getElementById(
                    'passwordSection'
                ).classList.remove(
                    'hidden'
                );



                document.getElementById(
                    'verifyBtn'
                ).innerHTML =
                    'Email Verified';



                document.getElementById(
                    'verifyBtn'
                ).disabled = true;



                document.getElementById(
                    'verifyBtn'
                ).classList.remove(
                    'bg-blue-500'
                );



                document.getElementById(
                    'verifyBtn'
                ).classList.add(
                    'bg-green-500'
                );

            }

            else {

                errorMessage.innerHTML =
                    data.error;

                errorMessage.classList.remove(
                    'hidden'
                );

            }

        }

        catch (error) {

            errorMessage.innerHTML =
                'Something went wrong';

            errorMessage.classList.remove(
                'hidden'
            );

        }

    }




    // =========================================
    // RESET PASSWORD
    // =========================================

    async function resetPassword() {

        let password = document.getElementById(
            'password'
        ).value;

        let confirmPassword = document.getElementById(
            'confirmPassword'
        ).value;

        let successMessage = document.getElementById(
            'successMessage'
        );

        let errorMessage = document.getElementById(
            'errorMessage'
        );



        successMessage.classList.add(
            'hidden'
        );

        errorMessage.classList.add(
            'hidden'
        );



        try {

            let response = await fetch(
                '/user/api/forgot-password/',
                {

                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrftoken,
                    },

                    body: JSON.stringify({

                        step: 'reset_password',
                        password: password,
                        confirm_password: confirmPassword

                    })

                }
            );



            let data = await response.json();



            if (response.ok) {

                successMessage.innerHTML =
                    data.message;

                successMessage.classList.remove(
                    'hidden'
                );



                setTimeout(() => {

                    window.location.href =
                        '/user/login/';

                }, 1500);

            }

            else {

                errorMessage.innerHTML =
                    data.error;

                errorMessage.classList.remove(
                    'hidden'
                );

            }

        }

        catch (error) {

            errorMessage.innerHTML =
                'Something went wrong';

            errorMessage.classList.remove(
                'hidden'
            );

        }

    }




    // =========================================
    // TOGGLE PASSWORD
    // =========================================

    function togglePassword(inputId, iconId) {

        const input = document.getElementById(
            inputId
        );

        const icon = document.getElementById(
            iconId
        );

        if (input.type === 'password') {

            input.type = 'text';

            icon.classList.remove(
                'fa-eye'
            );

            icon.classList.add(
                'fa-eye-slash'
            );

        }

        else {

            input.type = 'password';

            icon.classList.remove(
                'fa-eye-slash'
            );

            icon.classList.add(
                'fa-eye'
            );

        }

    }

</script>

{% endblock %}
