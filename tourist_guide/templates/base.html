{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>{% block title %}Travel Explorer{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <link rel="icon" type="image/x-icon" href="{% static 'images\GET OUR GUIDE LOGO (revised) 200x70.png' %}">


    
    <style>

        *{
            font-family: 'Inter', sans-serif;
        }

        body{
            background: #F5F7FB;
        }

        .hero-bg{
            background:
            linear-gradient(
                rgba(6,18,38,0.72),
                rgba(6,18,38,0.72)
            ),
            url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e");

            background-size: cover;
            background-position: center;
        }

        .card-hover{
            transition: 0.3s ease;
        }

        .card-hover:hover{
            transform: translateY(-6px);
        }

    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

    <!-- HEADER -->
    {% include 'header.html' %}

    <!-- PAGE CONTENT -->
    {% block content %}
    {% endblock %}

    {% include 'footer.html' %}

    {% block extra_js %}{% endblock %}
<!-- WhatsApp Floating Button -->
<!-- WhatsApp Floating Button -->
<a
    href="https://wa.me/919876543210?text=Hello%20Tourist%20Guide%2C%20I%20need%20help%20with%20a%20tour."
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Chat with us on WhatsApp"
    class="fixed bottom-6 right-6 z-50 bg-[#25D366] hover:bg-[#20bd5a] text-white rounded-full shadow-lg hover:shadow-xl transition-all duration-300 hover:scale-105 flex items-center gap-3 px-5 py-3"
>
    <i class="fa-brands fa-whatsapp text-2xl"></i>
    {% comment %} <span class="font-semibold text-sm">
        Chat with us
    </span> {% endcomment %}
</a>
</body>
</html>
